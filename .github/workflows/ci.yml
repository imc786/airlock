name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Post-merge build so two independently-green auto-merges that conflict surface here, not on the next PR.
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ubuntu-24.04, not ubuntu-latest, so an OS release jump (new apt sources) is a reviewed edit. The image
# itself still updates weekly, so a block-mode job can meet a new host; its harden-runner log names it.
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      # GitHub's own runner endpoints are allowed implicitly; these are the rest, as observed in audit mode.
      - name: Harden runner (block non-allowlisted egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned by SHA-256 like the actions here, but Dependabot cannot see a download, so bump by hand.
      - name: Lint workflows (actionlint, zizmor)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -o /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          curl -fsSL -o /tmp/zizmor.tar.gz https://github.com/zizmorcore/zizmor/releases/download/v1.30.1/zizmor-x86_64-unknown-linux-gnu.tar.gz
          printf '%s\n' \
            "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" \
            "e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a  /tmp/zizmor.tar.gz" \
            | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          tar -xzf /tmp/zizmor.tar.gz -C /tmp zizmor
          /tmp/actionlint
          /tmp/zizmor --no-progress .github/workflows/

      - name: Setup pnpm
        # No version: derived from package.json's packageManager field.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome, non-mutating gate)
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm build

      # tsc needs Next's generated next-env.d.ts, written only by next build, so this runs after Build.
      - name: Type check
        run: pnpm type-check

      # No E2E here: it runs once in preview-e2e against the deployed preview.

  # Run Playwright against the real Vercel preview. Skipped for forks (no preview is built for them),
  # which also skips the auto-merge jobs that need it.
  preview-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: build
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      deployments: read
      pull-requests: read
      statuses: read

    steps:
      # Observed set: Playwright's CDNs, the image's apt sources (the Ubuntu mirror is plain HTTP) and the
      # preview. *.vercel.app is the one broad entry: preview hosts are per-deployment.
      - name: Harden runner (block non-allowlisted egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            registry.npmjs.org:443
            cdn.playwright.dev:443
            playwright.download.prss.microsoft.com:443
            storage.googleapis.com:443
            azure.archive.ubuntu.com:80
            packages.microsoft.com:443
            dl.google.com:443
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            *.vercel.app:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright (Chromium)
        run: pnpm exec playwright install chromium --with-deps

      - name: Wait for Vercel preview deployment
        id: vercel-preview
        uses: patrickedqvist/wait-for-vercel-preview@d7982701e6fcd3ae073bff929e408e004404d38d # v1.3.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          allow_inactive: false
          max_timeout: 600

      - name: End-to-end tests (against Vercel preview)
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.vercel-preview.outputs.url }}
        run: pnpm test:e2e

  # Auto-merge Dependabot minor/patch PRs once both gates pass. Dependabot pushes to this repo (not a
  # fork), so it gets a preview and preview-e2e applies. Keyed on the PR author, not github.actor, which
  # is whoever triggered the run (you, if you reopen the PR).
  dependabot-auto-merge:
    runs-on: ubuntu-24.04
    needs: [build, preview-e2e]
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write

    steps:
      # Merge jobs only talk to GitHub, so egress is blocked to exactly that.
      - name: Harden runner (block non-allowlisted egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge minor and patch updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch'
        # --match-head-commit refuses a head pushed after CI ran. If main moved instead, the post-merge build
        # on main is what catches it.
        run: gh pr merge --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The file-scope check below admits only the workspace file and the lockfile, but their contents can
  # still change what pnpm installs. So main regenerates them itself and the PR must match exactly: the
  # PR's files are compared, never executed or trusted.
  audit-pr-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: >-
      github.head_ref == 'automated/audit-fix' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner
    permissions:
      contents: read

    steps:
      - name: Harden runner (block non-allowlisted egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            registry.npmjs.org:443

      # main, not the PR: every input to the regeneration must come from the branch the PR cannot change.
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json

      # audit.yml's regeneration, step for step; tests/workflow-guards.test.ts keeps the two identical.
      - name: Reset managed config to base
        run: cp pnpm-workspace.base.yaml pnpm-workspace.yaml

      - name: Natural re-resolve (prunes stale overrides)
        run: pnpm install --lockfile-only --no-frozen-lockfile --config.minimumReleaseAgeStrict=false

      - name: Re-apply audit fixes
        continue-on-error: true
        run: pnpm audit --fix=override --no-optional --config.minimumReleaseAgeStrict=false

      - name: Reconcile lockfile with regenerated overrides
        run: pnpm install --lockfile-only --no-frozen-lockfile --config.minimumReleaseAgeStrict=false

      - name: Fail closed if advisories remain
        run: pnpm audit --no-optional

      - name: Checkout the PR's two dependency files only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
          sparse-checkout: |
            pnpm-lock.yaml
            pnpm-workspace.yaml
          sparse-checkout-cone-mode: false

      # A mismatch fails closed. If main moved or a version crossed the quarantine since the audit run,
      # the next daily run regenerates the PR; otherwise it is a change the audit job did not make.
      - name: Require the PR to match main's regeneration
        run: |
          for file in pnpm-workspace.yaml pnpm-lock.yaml; do
            if ! cmp -s "$file" "pr/$file"; then
              echo "::error::$file differs from main's own regeneration; review this PR by hand."
              diff -u "$file" "pr/$file" | head -n 200
              exit 1
            fi
          done

      # CI installs with trustLockfile, which skips the release-age check on committed pins; run it here.
      # Exclusions that audit --fix wrote still apply, so only a silently fast-tracked pin fails.
      - name: Refuse pins inside the quarantine window
        run: |
          sed -i -E 's/^trustLockfile:.*/trustLockfile: false/' pnpm-workspace.yaml
          pnpm install --frozen-lockfile --lockfile-only

  # Auto-merge the daily audit-fix PR only once every gate passes: audit --fix can inject breaking
  # major overrides, so branch name + actor alone is never enough.
  audit-fix-auto-merge:
    runs-on: ubuntu-24.04
    needs: [build, preview-e2e, audit-pr-guard]
    if: >-
      github.head_ref == 'automated/audit-fix' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner
    permissions:
      contents: write
      pull-requests: write

    steps:
      # Merge jobs only talk to GitHub, so egress is blocked to exactly that.
      - name: Harden runner (block non-allowlisted egress)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443

      # Blast-radius guard: only AUTOMATION_TOKEN reaches this job, so this matters only if that PAT is
      # compromised. Fail loudly. The --match-head-commit flag below still pins to the tested head.
      - name: Assert audit PR only touches dependency config
        run: |
          # Fetch first so a gh failure trips set -e; piped into grep it would read as safe.
          files="$(gh pr diff --name-only "$PR_URL")"
          [ -n "$files" ] || { echo "::error::gh pr diff returned no files."; exit 1; }
          unexpected="$(printf '%s\n' "$files" | grep -vE '^(pnpm-lock\.yaml|pnpm-workspace\.yaml)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::Audit PR changes files outside {pnpm-lock.yaml, pnpm-workspace.yaml}:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge audit fix PR
        run: gh pr merge --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
