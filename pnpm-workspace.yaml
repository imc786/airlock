# Managed file. Edit pnpm-workspace.base.yaml (the source of truth); the live pnpm-workspace.yaml is
# regenerated from base + `pnpm audit --fix` output by .github/workflows/audit.yml. Hand-edits to the
# live file are reverted by the next audit run.

# pnpm 11 reads project settings from here, not from a "pnpm" field in package.json.

# Deny dependency build scripts by default; every package with a build script must be decided here.
allowBuilds:
  sharp: false # prebuilt platform binaries ship via optionalDependencies; no build needed, no image use here
  core-js: false # postinstall is only a funding message, nothing to build

# One-day supply-chain quarantine, set explicitly so strict resolution blocks day-zero packages
# rather than silently falling back to a too-new version.
minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - postcss@8.5.10 || 8.5.12 || 8.5.18 || 8.5.23
  - nanoid@3.3.17

overrides:
  nanoid@<3.3.17: ^3.3.17
  postcss@<8.5.10: ^8.5.10
  postcss@<=8.5.11: ^8.5.12
  postcss@<=8.5.17: ^8.5.18
  postcss@<=8.5.22: ^8.5.23

# Skip re-applying the age check to the already-committed lockfile on install, so cold-store CI does
# not go red for ~24h after any dependency change.
trustLockfile: true
